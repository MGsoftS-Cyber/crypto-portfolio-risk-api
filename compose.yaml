services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crypto
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - crypto_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "127.0.0.1:8088:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://crypto:${POSTGRES_PASSWORD}@db:5432/crypto
      ALLOWED_ORIGINS: http://localhost:8088,http://127.0.0.1:8088
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COINGECKO_DEMO_API_KEY: ${COINGECKO_DEMO_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  crypto_postgres:
